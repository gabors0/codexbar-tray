[package]
name = "limitray"
version = "0.4.2"
edition = "2021"
build = "build.rs"
description = "Claude (and other AI) usage limits in your Linux tray, powered by the CodexBar CLI"
license = "MIT"

[[bin]]
name = "limitray"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui_extras = { version = "0.37", features = ["svg"] }
ksni = { path = "vendor/ksni", features = ["blocking"] }
ab_glyph = "0.2"
resvg = "0.48"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
